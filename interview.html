<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interview Agent</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <a href="index.html" class="brand"><span class="dot"></span> AI Career Navigator</a>
  <a href="index.html" class="back">← Dashboard</a>
</div>

<div class="page">

  <div class="agent-route">Orchestrator <span class="arrow">→</span> Interview Prep Agent</div>

  <div class="tool-card">

    <h1>🎤 AI Interview Agent</h1>
    <p>Pick a role, get a question, then submit your answer for instant feedback.</p>

    <select id="role">
      <option>Java Developer</option>
      <option>Backend Developer</option>
      <option>Frontend Developer</option>
      <option>Full Stack Developer</option>
      <option>Python Developer</option>
    </select>

    <button onclick="generateQuestion()">Generate Question</button>

    <div id="question" class="output">Interview question will appear here.</div>

    <textarea id="answer" rows="6" placeholder="Write your answer here..."></textarea>
    <button onclick="evaluateAnswer()">Evaluate Answer</button>

    <div id="feedback" class="output">Feedback will appear here.</div>

  </div>

</div>

<script>
let currentQuestion = "";

async function generateQuestion(){

  const role = document.getElementById("role").value;
  const box = document.getElementById("question");

  box.innerHTML = `<div class="loading"><span class="spinner"></span> Generating question...</div>`;

  try{
    const response = await fetch("http://127.0.0.1:5000/interview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ role, action: "question" })
    });

    const data = await response.json();

    if(!response.ok){
      box.innerHTML = `❌ ${data.error || "Something went wrong."}`;
      return;
    }

    currentQuestion = data.question;
    box.innerText = currentQuestion;

  } catch(error){
    box.innerHTML = "❌ Unable to connect to backend.";
  }
}

async function evaluateAnswer(){

  const answer = document.getElementById("answer").value;
  const box = document.getElementById("feedback");

  if(!currentQuestion){
    alert("Generate a question first.");
    return;
  }

  if(answer.trim() === ""){
    alert("Write your answer first.");
    return;
  }

  box.innerHTML = `<div class="loading"><span class="spinner"></span> Evaluating your answer...</div>`;

  try{
    const response = await fetch("http://127.0.0.1:5000/interview", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "evaluate", question: currentQuestion, answer })
    });

    const data = await response.json();

    if(!response.ok){
      box.innerHTML = `❌ ${data.error || "Something went wrong."}`;
      return;
    }

    box.innerText = data.feedback;

  } catch(error){
    box.innerHTML = "❌ Unable to connect to backend.";
  }
}
</script>

</body>
</html>
